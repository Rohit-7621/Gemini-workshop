<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container content">

        <h1 class="big-title" id="title">Ask me anything!</h1>

        <section id="chat-section"></section>

        <footer class="input-footer fixed">

            <input
                autofocus
                type="text"
                class="input-footer__input"
                id="prompt"
                placeholder="Ask something..."
            >

            <button
                type="button"
                class="input-footer__submit"
                id="submit-button">
                Submit
            </button>

        </footer>

    </div>

    <script>

        const input = document.getElementById("prompt");
        const chatSection = document.getElementById("chat-section");
        const submit = document.getElementById("submit-button");


        async function sendMessage() {

            const value = input.value.trim();

            // Don't send empty messages
            if (!value) {
                return;
            }


            // Show user's message
            const userMessage = document.createElement("div");

            userMessage.className = "user-message";
            userMessage.textContent = value;

            chatSection.appendChild(userMessage);


            // Clear input
            input.value = "";


            // Show loading message
            const responseMessage = document.createElement("div");

            responseMessage.className = "response-message";
            responseMessage.textContent = "Thinking...";

            chatSection.appendChild(responseMessage);


            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        prompt: value
                    })

                });


                // Get response as text first
                const text = await response.text();

                console.log("Status:", response.status);
                console.log("Server response:", text);


                if (!response.ok) {

                    throw new Error(
                        text || "Server returned an error"
                    );

                }


                // Convert server response to JSON
                const data = JSON.parse(text);


                if (data.reply) {

                    responseMessage.textContent = data.reply;

                } else {

                    responseMessage.textContent =
                        "Gemini didn't return a reply.";

                }


            } catch (error) {

                console.error("ERROR:", error);

                responseMessage.textContent =
                    "Error: " + error.message;

            }


            // Scroll chat to bottom
            chatSection.scrollTop =
                chatSection.scrollHeight;

        }


        // Submit button
        submit.addEventListener("click", sendMessage);


        // Enter key
        input.addEventListener("keydown", function (event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendMessage();

            }

        });

    </script>

</body>

</html>
